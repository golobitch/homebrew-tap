name: ci

# The formula and the cask here are written by bump-tap.yml in golobitch/tb-explorer, from
# templates. That means a mistake in a template arrives as a commit in this repository, and without
# this workflow the first person to notice would be whoever runs `brew install` next.
#
# Runs on macOS because a cask can only be audited there.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: macos-15
    steps:
      # Checks this repository out as a tap, in the place Homebrew expects to find one, and sets
      # up the gems `brew style` needs. On `main`: the repository renamed its default branch, so
      # the `@master` that most documentation still shows no longer resolves.
      - name: Set up Homebrew
        id: homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Style, audit and install what is here
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        env:
          TAP: ${{ steps.homebrew.outputs.tap-name }}
        run: |
          shopt -s nullglob
          files=(Formula/*.rb Casks/*.rb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::notice::Nothing here yet — the first release writes the formula and the cask."
            exit 0
          fi
          printf 'checking: %s\n' "${files[@]}"

          brew style "$TAP"

          # --online fetches the release assets and checks the checksums against them, which is the
          # whole point: a rendered template with a stale sha256 installs nothing.
          brew audit --strict --online --tap="$TAP"

          # Proof rather than inference: "the audit passed" and "it installs" are different claims.
          # The cask is not installed — putting a notarized app on a runner would tell us nothing
          # the audit did not.
          if [ -f Formula/tb-tui.rb ]; then
            brew install "$TAP/tb-tui"
            tb-tui --help
          fi
